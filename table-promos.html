<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Promos</title>
</head>
<style>
    table, th, td {
        border: 2px solid red;
        border-collapse: collapse;
        padding: 30px;
    }
    .container {
        display: flex;
        gap: 40px;
        justify-content: center;
        margin-top: 70px;
    }
</style>
<body>
    <div class="container">
        <table>
            <tr>
                <th>Promo 1</th>
            </tr>
            <tr>
                <td>2 Fried Chicken
                    <br>
                    2 Cola
                    <br>
                    1 Rice
                </td>
            </tr>
            <tr>
                <td>IDR. 55.000,-</td>
            </tr>
        </table> 
        <table>
            <tr>
                <th>Promo 2</th>
            </tr>
            <tr>
                <td>4 Fried Chicken
                    <br>
                    2 Cola
                    <br>
                    2 Rice
                </td>
            </tr>
            <tr>
                <td>IDR. 80.000,-</td>
            </tr>
        </table>
        <table>
            <tr>
                <th>Promo 3</th>
            </tr>
            <tr>
                <td>8 Fried Chicken
                    <br>
                    4 Cola
                    <br>
                    4 Rice
                </td>
            </tr>
            <tr>
                <td>IDR. 120.000,-</td>
            </tr>
        </table>
    </div>

</body>
</html>
